[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizon-dark-editor"
version = "0.1.0"
description = "Darkest Dungeon save/game editor without external Java tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "f1cu_71"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
bizon-dark = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
